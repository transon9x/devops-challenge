---
name: quality-gate

# Shared quality gate. Callers may only make it stricter: the severity floor and
# the coverage floor are enforced here, not in the application repository.
on:
  workflow_call:
    inputs:
      app_dir:
        description: Directory of the application inside the calling repository
        type: string
        default: '.'
      stack:
        description: Language stack (node)
        type: string
        required: true
      node_version:
        type: string
        default: '24'
      coverage_min:
        description: Minimum line coverage in percent (floor 70)
        type: string
        default: '80'
      fail_on:
        description: Block on findings at this severity or above (high | medium | low)
        type: string
        default: high
      dockerfile:
        description: Dockerfile path relative to app_dir; empty skips the Dockerfile lint
        type: string
        default: ''
      sonar_project_key:
        description: SonarQube project key; the Sonar job runs only when vars.SONAR_HOST_URL is set
        type: string
        default: ''
    secrets:
      SONAR_TOKEN:
        required: false

permissions: {}

env:
  TEMPLATE_DIR: .ci-templates

jobs:
  policy:
    name: Policy floor
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      fail_on: ${{ steps.check.outputs.fail_on }}
      coverage_min: ${{ steps.check.outputs.coverage_min }}
    steps:
      - name: Reject inputs weaker than the organisation floor
        id: check
        env:
          FAIL_ON: ${{ inputs.fail_on }}
          COVERAGE_MIN: ${{ inputs.coverage_min }}
          STACK: ${{ inputs.stack }}
        run: |
          set -euo pipefail
          case "$FAIL_ON" in
            high | medium | low) ;;
            *) echo "::error::fail_on must be high, medium or low (critical is below the floor)"; exit 1 ;;
          esac
          [[ "$COVERAGE_MIN" =~ ^[0-9]{1,3}$ ]] || { echo "::error::coverage_min must be an integer"; exit 1; }
          if (( COVERAGE_MIN < 70 || COVERAGE_MIN > 100 )); then
            echo "::error::coverage_min must be between 70 (the floor) and 100"; exit 1
          fi
          [[ "$STACK" == "node" ]] || { echo "::error::unsupported stack '${STACK}'"; exit 1; }
          {
            echo "fail_on=$FAIL_ON"
            echo "coverage_min=$COVERAGE_MIN"
          } >> "$GITHUB_OUTPUT"

  unit:
    name: Lint, unit tests, coverage, dependency signatures
    needs: policy
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.app_dir }}/package-lock.json
      - name: Install from the lockfile
        working-directory: ${{ inputs.app_dir }}
        run: npm ci
      - name: Verify registry signatures and provenance of every dependency
        working-directory: ${{ inputs.app_dir }}
        run: npm audit signatures
      - name: Lint
        working-directory: ${{ inputs.app_dir }}
        run: npm run lint
      - name: Unit tests with the coverage floor
        working-directory: ${{ inputs.app_dir }}
        env:
          COVERAGE_MIN: ${{ needs.policy.outputs.coverage_min }}
        run: |
          set -euo pipefail
          mkdir -p coverage
          node --test --experimental-test-coverage \
            --test-coverage-lines="$COVERAGE_MIN" \
            --test-coverage-exclude='test/**' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=coverage/lcov.info \
            'test/**/*.test.js'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-unit-${{ github.run_id }}-${{ hashFiles(format('{0}/package.json', inputs.app_dir)) }}
          path: ${{ inputs.app_dir }}/coverage/lcov.info
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks)
    needs: policy
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out this template revision (not the caller's repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.TEMPLATE_DIR }}
          persist-credentials: false
      - name: Install the pinned scanner
        run: bash "${TEMPLATE_DIR}/ci/scripts/install-tool.sh" gitleaks
      - name: Scan the git history
        env:
          SOURCE_DIR: ${{ github.workspace }}
          OUT_DIR: ${{ runner.temp }}/scan
          PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE" && -n "$PR_HEAD" ]]; then export GITLEAKS_LOG_OPTS="${PR_BASE}..${PR_HEAD}"; fi
          bash "${TEMPLATE_DIR}/ci/scripts/gate-gitleaks.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ always() }}
        with:
          name: gitleaks-${{ github.run_id }}-${{ github.job }}-${{ hashFiles(format('{0}/package.json', inputs.app_dir)) }}
          path: ${{ runner.temp }}/scan/gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 30

  sast:
    name: Static analysis (semgrep)
    needs: policy
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check out this template revision (not the caller's repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.TEMPLATE_DIR }}
          persist-credentials: false
      - name: Resolve the pinned rule set
        id: rules
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "${TEMPLATE_DIR}/ci/tools.env"
          echo "repo=${SEMGREP_RULES_REPO}" >> "$GITHUB_OUTPUT"
          echo "sha=${SEMGREP_RULES_SHA}" >> "$GITHUB_OUTPUT"
      - name: Check out the rules at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ steps.rules.outputs.repo }}
          ref: ${{ steps.rules.outputs.sha }}
          path: .semgrep-rules
          persist-credentials: false
      - name: Translate scan-ignore.yml (expired entries are re-flagged)
        env:
          APP_DIR: ${{ inputs.app_dir }}
          OUT_DIR: ${{ runner.temp }}/scan
        run: python3 "${TEMPLATE_DIR}/ci/scripts/scan_ignore.py" "${APP_DIR}/.ci/scan-ignore.yml" "$OUT_DIR"
      - name: Scan (digest-pinned image, offline, commit-pinned rules)
        env:
          APP_DIR: ${{ inputs.app_dir }}
          STACK: ${{ inputs.stack }}
          FAIL_ON: ${{ needs.policy.outputs.fail_on }}
          OUT_DIR: ${{ runner.temp }}/scan
          RULES_DIR: ${{ github.workspace }}/.semgrep-rules
        run: bash "${TEMPLATE_DIR}/ci/scripts/gate-semgrep.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ always() }}
        with:
          name: semgrep-${{ github.run_id }}-${{ github.job }}-${{ hashFiles(format('{0}/package.json', inputs.app_dir)) }}
          path: ${{ runner.temp }}/scan/semgrep.sarif
          if-no-files-found: ignore
          retention-days: 30

  sca:
    name: Dependencies, misconfiguration, licences, SBOM (trivy)
    needs: policy
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check out this template revision (not the caller's repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.TEMPLATE_DIR }}
          persist-credentials: false
      - name: Install the pinned scanner
        run: bash "${TEMPLATE_DIR}/ci/scripts/install-tool.sh" trivy
      - name: Translate scan-ignore.yml (expired entries are re-flagged)
        env:
          APP_DIR: ${{ inputs.app_dir }}
          OUT_DIR: ${{ runner.temp }}/scan
        run: python3 "${TEMPLATE_DIR}/ci/scripts/scan_ignore.py" "${APP_DIR}/.ci/scan-ignore.yml" "$OUT_DIR"
      - name: Scan
        env:
          APP_DIR: ${{ inputs.app_dir }}
          FAIL_ON: ${{ needs.policy.outputs.fail_on }}
          OUT_DIR: ${{ runner.temp }}/scan
        run: bash "${TEMPLATE_DIR}/ci/scripts/gate-trivy.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ always() }}
        with:
          name: sbom-${{ github.run_id }}-${{ github.job }}-${{ hashFiles(format('{0}/package.json', inputs.app_dir)) }}
          path: |
            ${{ runner.temp }}/scan/sbom.cdx.json
            ${{ runner.temp }}/scan/trivy-fs.json
          if-no-files-found: ignore
          retention-days: 30

  dependency-review:
    name: Dependency review (pull requests)
    if: ${{ github.event_name == 'pull_request' }}
    needs: policy
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: ${{ needs.policy.outputs.fail_on }}
          comment-summary-in-pr: never

  dockerfile:
    name: Dockerfile lint (hadolint)
    if: ${{ inputs.dockerfile != '' }}
    needs: policy
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check out this template revision (not the caller's repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.TEMPLATE_DIR }}
          persist-credentials: false
      - name: Install the pinned linter
        run: bash "${TEMPLATE_DIR}/ci/scripts/install-tool.sh" hadolint
      - name: Lint
        env:
          DOCKERFILE: ${{ inputs.app_dir }}/${{ inputs.dockerfile }}
        run: hadolint --failure-threshold warning "$DOCKERFILE"

  sonar:
    name: SonarQube quality gate
    if: ${{ vars.SONAR_HOST_URL != '' }}
    needs: [policy, unit]
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-unit-${{ github.run_id }}-${{ hashFiles(format('{0}/package.json', inputs.app_dir)) }}
          path: ${{ inputs.app_dir }}/coverage
      - name: Require a project key
        env:
          KEY: ${{ inputs.sonar_project_key }}
        run: |
          set -euo pipefail
          [[ -n "$KEY" ]] || { echo "::error::sonar_project_key is required when SONAR_HOST_URL is set"; exit 1; }
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4  # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # zizmor: ignore[secrets-outside-env] optional scanner token, scoped by the caller
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: ${{ inputs.app_dir }}
          args: >-
            -Dsonar.projectKey=${{ inputs.sonar_project_key }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  sonar-not-configured:
    name: SonarQube quality gate
    if: ${{ vars.SONAR_HOST_URL == '' }}
    needs: policy
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report that the optional gate is not configured
        run: |
          echo "::notice::SonarQube is not configured for this repository (set vars.SONAR_HOST_URL and secrets.SONAR_TOKEN to enable it)."
          echo "SonarQube: not configured, skipped" >> "$GITHUB_STEP_SUMMARY"
