log_format json_access escape=json
    '{"ts":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"request_time":$request_time,"bytes_sent":$body_bytes_sent}';

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;

# Backpressure at the edge, sized against the API: DB_POOL_MAX 8 queries, MAX_INFLIGHT 16
# accepted requests. Excess is refused here, cheaply, instead of queueing in the API's heap.
limit_req_zone $binary_remote_addr zone=perip:1m rate=50r/s;
limit_conn_zone $server_name zone=apitotal:1m;

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log json_access;

    set $api_host "api";
    set $api_port "3000";

    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    location = / {
        return 200 "Welcome to the platform\n";
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=perip burst=25 nodelay;
        limit_conn apitotal 32;
        limit_req_status 503;
        limit_conn_status 503;
        proxy_pass http://$api_host:$api_port;
    }

    location = /status {
        proxy_pass http://$api_host:$api_port;
    }

    location = /live {
        proxy_pass http://$api_host:$api_port;
    }

    location = /ready {
        proxy_pass http://$api_host:$api_port;
    }
}
